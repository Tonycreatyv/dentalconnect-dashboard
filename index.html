<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/icon-192.png" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <title>Conexxion | LG Community Network</title>

    <!-- Open Graph / Facebook / Messenger -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://referral.creatyv.io/" />
    <meta property="og:title" content="Conexxion | LG Community Network" />
    <meta property="og:description" content="Conecta con servicios, beneficios, cupones y recursos de confianza para nuestra comunidad." />
    <meta property="og:locale" content="es_US" />
    <meta property="og:site_name" content="Conexxion" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Conexxion | LG Community Network" />
    <meta name="twitter:description" content="Conecta con servicios, beneficios, cupones y recursos de confianza para nuestra comunidad." />

    <!-- SEO -->
    <meta name="description" content="Conecta con servicios, beneficios, cupones y recursos de confianza para nuestra comunidad." />
    <meta name="application-name" content="Conexxion" />
    <link rel="canonical" href="https://referral.creatyv.io/" />

    <!-- PWA Manifest -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#0b0b0b" />

    <!-- Apple -->
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Conexxion" />

    <!-- Mobile Optimizations -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="format-detection" content="telephone=no" />
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>

    <!-- Service Worker -->
    <script>
      if ("serviceWorker" in navigator) {
        window.addEventListener("load", () => {
          navigator.serviceWorker
            .register("/sw.js")
            .then((registration) => {
              console.log("✅ Service Worker registrado:", registration);
            })
            .catch((error) => {
              console.log("❌ Error registrando Service Worker:", error);
            });
        });
      }
    </script>
  </body>
</html>
