name: ConeXXion Verify

on:
  pull_request:
    paths:
      - "src/apps/referral-hub/**"
      - "src/apps/referral-partner/**"
      - "src/referral/**"
      - "supabase/**"
      - "tools/check-conexxion-boundaries.mjs"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/conexxion-verify.yml"
  push:
    branches:
      - "hardening/conexxion-v2-final"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Prepare Vite native dependency
        run: npm rebuild esbuild

      - name: Enforce ConeXXion architecture boundary
        run: npm run check:conexxion

      - name: Typecheck
        run: npm run typecheck:conexxion

      - name: Production build
        run: npm run build
